# Host identity. One entity_id per HOST, not per process — invariant 5.
entity_id: vm1

output_root: /var/lib/blurredbox-agd/cold
heartbeat: /var/lib/blurredbox-agd/cold/heartbeat
spool_dir: /var/lib/blurredbox-agd/spool     # step 6: sdk_hook.record() writes here

watch:
  # Substring match against the full cmdline, then the process name.
  patterns: ["freqtrade", "uvicorn"]
  pids: []                 # explicit pids, merged with pattern matches
  refresh_seconds: 60      # rescan for new/dead processes

# Fields not worth their syscall on this host. The column stays in the parquet
# schema and reads back null — the schema is fixed so every day's file still
# globs together. process_id, timestamp, cpu_usage and memory_usage_mb are what
# makes a poll row a poll row and cannot be listed; gpu_* here can be, because
# the d=5 gpu fields come from sdk_hook's request rows, not from this table.
# On a CPU-only host the gpu_* three are pure zeros; num_connections is 0 for a
# process in another network namespace (docker) and costs a /proc/net scan.
skip_fields: []
# skip_fields: [gpu_usage, gpu_vram_mb, gpu_temperature, num_connections]

cadence_seconds: 1         # the 1 Hz poll
flush_seconds: 60          # buffer drain; bounds memory, not crash loss
segment_seconds: 900       # samples: the 1 Hz firehose; bounds crash loss — see D1
request_segment_seconds: 60  # requests: scarce d=5 rows, small files, 60s exposure
max_disk_pct: 90           # refuse to write above this, loudly

# Optional. Path to the BlurredBox-AGD checkout; enables SystemMetricsPoller
# for host-level GPU/freqtrade fields (invariant 8). Omit to use pynvml directly.
# agd_repo: /home/you/Desktop/BlurredBox-AGD

# Run-constant metadata, copied verbatim into manifest.json. Keys must be a
# subset of schema.MANIFEST_FIELDS or startup fails.
manifest:
  model_id: ""
  model_version_id: ""
  slug: ""
  tenant_id: ""
  operator_id: ""
  environment: production
  artifact_id: ""
